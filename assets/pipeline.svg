<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="240" viewBox="0 0 1040 240" role="img" aria-labelledby="title desc">
<title id="title">Sequential GAN to diffusion inpainting pipeline</title>
<desc id="desc">Input and mask go to EdgeConnect; its saved coarse reconstruction and the mask go to Stable Diffusion refinement, producing the hybrid output.</desc>
<rect width="1040" height="240" fill="#ffffff"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#182635">
<text x="520" y="28" font-size="20" font-weight="bold">Hybrid Controllable Inpainting · existing experimental workflow</text>
<g stroke="#526a7d" stroke-width="2" fill="#edf3f7">
<rect x="20" y="78" width="170" height="90" rx="6"/><rect x="240" y="78" width="190" height="90" rx="6"/>
<rect x="480" y="78" width="150" height="90" rx="6"/><rect x="680" y="78" width="190" height="90" rx="6"/>
<rect x="920" y="78" width="100" height="90" rx="6"/></g>
<g font-size="16"><text x="105" y="114">Input image</text><text x="105" y="140">+ binary mask</text>
<text x="335" y="114">EdgeConnect GAN</text><text x="335" y="140">edges → completion</text>
<text x="555" y="114">Saved coarse</text><text x="555" y="140">reconstruction</text>
<text x="775" y="114">Stable Diffusion</text><text x="775" y="140">inpainting refinement</text>
<text x="970" y="114">Hybrid</text><text x="970" y="140">output</text></g>
<text x="775" y="204" font-size="14">Original mask · 50 steps · guidance 7.5</text>
<text x="520" y="229" font-size="13">Sequential inference using pretrained models; no joint training or measured speedup implied.</text></g>
<g stroke="#526a7d" stroke-width="2" fill="none"><path d="M190 123H230m-9-6 9 6-9 6M430 123H470m-9-6 9 6-9 6M630 123H670m-9-6 9 6-9 6M870 123H910m-9-6 9 6-9 6"/><path d="M105 168V185H775V168"/></g>
</svg>
